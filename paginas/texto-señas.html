<!DOCTYPE html>
    <html lang ="es">
    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Texto → Señas</title>
        <link rel="stylesheet" href="../css/externo.css">
    </head>

    <body>
 
        <header>
            <h1>Texto → Señas</h1>
            <p>Convierte tus palabras en Lengua de Señas Colombiana</p>
        </header>
        <main>
            <section class="convertidor">
                <h2>Escribe tu mensaje</h2>
                <p>
                    Escribe una palabra o frase y conviertela en Lengua de Señas Colombiana.
                </p>

                <textarea id="textoUsuario" placeholder="Escribe aqui tu mensaje:"></textarea>

                <button id="btnConvertir" class="btn" type="button">
                    Convertir
                </button>

                <div class="avatar-contenedor" id="avatar-contenedor">
                    <p>Tu seña aparecerá aquí</p>
                </div>

            </section>
            
        </main>

        
            <a href="../index.html" class="btn volver">Volver</a>

         <footer>
            <p>Comunicarse es un derecho NO un privilegio</p>
        </footer>

        <script src="../js/texto-senas.js"></script>
          
    </body>

</html>
